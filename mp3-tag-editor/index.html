<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MP3 Tag Editor</title>
    <style>
      /* Modern animated gradient background */
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }
      
      @keyframes shimmer {
        0% { background-position: -200% center; }
        100% { background-position: 200% center; }
      }
      
      @keyframes slideIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      @keyframes glow {
        0%, 100% { box-shadow: 0 0 5px var(--accent-cyan), 0 0 10px var(--accent-cyan), 0 0 15px var(--accent-cyan), 0 0 20px var(--accent-purple); }
        50% { box-shadow: 0 0 10px var(--accent-pink), 0 0 20px var(--accent-pink), 0 0 30px var(--accent-pink), 0 0 40px var(--accent-purple); }
      }
      
      :root {
        /* Dark theme with neon accent colors */
        --bg-primary: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
        --bg-card: rgba(255, 255, 255, 0.08);
        --text-primary: #ffffff;
        --text-secondary: #e0e0ff;
        --text-muted: #a0a0ff;
        --text-light: #8080ff;
        --border-color: rgba(138, 43, 226, 0.3);
        --shadow: rgba(0, 0, 0, 0.2);
        
        /* Neon accent colors */
        --accent-pink: #ff00ff;
        --accent-cyan: #00ffff;
        --accent-purple: #8a2be2;
        --accent-blue: #00bfff;
        --accent-green: #00ff7f;
        --accent-yellow: #ffff00;
        --accent-orange: #ff7f00;
        
        /* Glass effect */
        --glass-bg: rgba(255, 255, 255, 0.05);
        --glass-border: rgba(255, 255, 255, 0.1);
      }
      
      [data-theme="dark"] {
        --bg-primary: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
        --bg-card: rgba(255, 255, 255, 0.08);
        --text-primary: #ffffff;
        --text-secondary: #e0e0ff;
        --text-muted: #a0a0ff;
        --text-light: #8080ff;
        --border-color: rgba(138, 43, 226, 0.3);
        --shadow: rgba(0, 0, 0, 0.3);
      }
      
      * {
        box-sizing: border-box;
      }
      
      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow-x: hidden;
      }
      
      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: 
          radial-gradient(circle at 10% 20%, rgba(138, 43, 226, 0.15) 0%, transparent 50%),
          radial-gradient(circle at 90% 80%, rgba(0, 191, 255, 0.15) 0%, transparent 50%),
          radial-gradient(circle at 50% 50%, rgba(255, 0, 255, 0.1) 0%, transparent 50%);
        z-index: -1;
        animation: float 20s ease-in-out infinite;
      }
      
      /* Custom cursor effect */
      body {
        cursor: none;
      }
      
      .cursor {
        position: fixed;
        width: 20px;
        height: 20px;
        border: 2px solid var(--accent-cyan);
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        transform: translate(-50%, -50%);
        transition: width 0.2s, height 0.2s, border-color 0.2s;
      }
      
      .cursor.hover {
        width: 40px;
        height: 40px;
        border-color: var(--accent-pink);
        background: rgba(255, 0, 255, 0.1);
      }
      
      .neon-glow {
        box-shadow: 
          0 0 5px var(--accent-cyan),
          0 0 10px var(--accent-cyan),
          0 0 15px var(--accent-cyan),
          0 0 20px var(--accent-purple);
      }
    </style>
  </head>
  <body>
    <div id="main"></div>
    <script type="module">
      import init from "/mp3-tag-editor/assets/dioxus.js";
      
      // Initialize with saved theme preference
      const saved = localStorage.getItem('mp3-editor-dark-mode');
      if (saved === 'true') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
      
      // Custom cursor
      const cursor = document.createElement('div');
      cursor.className = 'cursor';
      document.body.appendChild(cursor);
      
      document.addEventListener('mousemove', (e) => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
      });
      
      document.addEventListener('mouseenter', () => cursor.classList.add('hover'), true);
      document.addEventListener('mouseleave', () => cursor.classList.remove('hover'), true);
      
      // Add hover effect to interactive elements
      setTimeout(() => {
        const interactiveElements = document.querySelectorAll('button, input, label');
        interactiveElements.forEach(el => {
          el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
          el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
        });
      }, 1000);
      
      init();
    </script>
  </body>
</html>
