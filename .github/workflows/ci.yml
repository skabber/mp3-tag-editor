name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src, wasm32-unknown-unknown
      - run: |
          cd mp3-tag-editor
          cargo check
      - run: |
          cd mp3-tag-editor
          cargo clippy -- -D warnings
      - run: |
          cd mp3-tag-editor
          cargo fmt --check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src, wasm32-unknown-unknown
      - run: |
          cd mp3-tag-editor
          cargo build --release --target wasm32-unknown-unknown

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          cd mp3-tag-editor
          cargo test