[package]
name = "mp3-tag-editor"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7.4", features = ["web"] }
dioxus-signals = "0.7.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
id3 = "1.16"
base64 = "0.22"
image = "0.25"
reqwest = { version = "0.12", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
